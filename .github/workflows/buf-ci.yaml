name: Buf CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    # Pushes, branch deletes and same-repo PRs use the Mac Studio runners;
    # fork PRs stay on hosted runners so outside code never runs there.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          # Publishing schema changes to the BSR requires a BSR authentication token.
          token: ${{ secrets.BUF_TOKEN }}
          # Include this line if you only want to set up the Action and do nothing else.
          # setup_only: true
          # Include a GitHub token to ensure API requests aren't rate limited.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publishing and archiving on the BSR need BUF_TOKEN. Without it, run
          # lint, format, build and breaking checks only instead of failing main.
          push: ${{ github.event_name == 'push' && secrets.BUF_TOKEN != '' }}
          archive: ${{ github.event_name == 'delete' && secrets.BUF_TOKEN != '' }}
