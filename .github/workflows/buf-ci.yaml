name: Buf CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  studio:
    # Which Mac Studio runner pools are online. While one is offline the jobs
    # below use their GitHub-hosted fallback (docs tools/studio-runners).
    name: Studio runners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      mac: ${{ steps.pick.outputs.mac }}
      arc: ${{ steps.pick.outputs.arc }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        uses: ghostnet-labs/docs/.github/actions/studio-runners@1fd19228149f7c2a3d37200b055a139081f457fe
        with:
          runner-token: ${{ secrets.RUNNER_READ_TOKEN }}
  buf:
    # Same-repo PRs run on the ephemeral ARC runners without BUF_TOKEN; pushes,
    # branch deletes and fork PRs stay on hosted runners, so the registry
    # token never reaches the self-hosted machine.
    needs: studio
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.studio.outputs.arc != 'false' && 'ghostnet-linux-arm64' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          # Publishing schema changes to the BSR requires a BSR authentication token.
          token: ${{ github.event_name != 'pull_request' && secrets.BUF_TOKEN || '' }}
          # Include this line if you only want to set up the Action and do nothing else.
          # setup_only: true
          # Include a GitHub token to ensure API requests aren't rate limited.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publishing and archiving on the BSR need BUF_TOKEN. Without it, run
          # lint, format, build and breaking checks only instead of failing main.
          push: ${{ github.event_name == 'push' && secrets.BUF_TOKEN != '' }}
          archive: ${{ github.event_name == 'delete' && secrets.BUF_TOKEN != '' }}
