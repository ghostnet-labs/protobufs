name: Buf CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          # Publishing schema changes to the BSR requires a BSR authentication token.
          token: ${{ secrets.BUF_TOKEN }}
          # Include this line if you only want to set up the Action and do nothing else.
          # setup_only: true
          # Include a GitHub token to ensure API requests aren't rate limited.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publishing and archiving on the BSR need BUF_TOKEN. Without it, run
          # lint, format, build and breaking checks only instead of failing main.
          push: ${{ github.event_name == 'push' && secrets.BUF_TOKEN != '' }}
          archive: ${{ github.event_name == 'delete' && secrets.BUF_TOKEN != '' }}
